<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Anime Database</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0e0e10; color: #eaeaea; margin: 0; padding: 0; }

    /* Header */
    header {
        background: #141416;
        border-bottom: 1px solid #222;
        padding: 16px 24px;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    .header-top {
        max-width: 1300px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
    }
    .brand { display: flex; flex-direction: column; }
    h1 { margin: 0; font-size: 22px; color: #ff4757; }
    .stats { color: #888; font-size: 13px; margin-top: 4px; }

    /* Search */
    .search {
        flex: 1;
        min-width: 220px;
        max-width: 500px;
        display: flex;
        gap: 8px;
    }
    .search input {
        flex: 1;
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid #2a2a2a;
        background: #0e0e10;
        color: #fff;
        font-size: 14px;
        outline: none;
    }
    .search input:focus { border-color: #ff4757; }
    .search button {
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        background: #ff4757;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
    }
    .search button:hover { background: #e03847; }

    /* Language switch */
    .lang-switch {
        display: flex;
        gap: 0;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #2a2a2a;
    }
    .lang-switch button {
        padding: 8px 14px;
        border: none;
        background: #1a1a1c;
        color: #888;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: background .15s, color .15s;
    }
    .lang-switch button:hover { background: #262629; color: #bbb; }
    .lang-switch button.active {
        background: #ff4757;
        color: #fff;
    }

    /* Filters panel */
    .filters {
        max-width: 1300px;
        margin: 16px auto 0;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
    }
    .filters.collapsed .filter-row { display: none; }

    .filter-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .filter-row label {
        font-size: 11px;
        color: #777;
        text-transform: uppercase;
        letter-spacing: .5px;
    }
    .filter-row select,
    .filter-row input {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        background: #0e0e10;
        color: #ddd;
        font-size: 13px;
        outline: none;
        font-family: inherit;
    }
    .filter-row select:focus,
    .filter-row input:focus { border-color: #ff4757; }
    .range { display: flex; gap: 6px; align-items: center; }
    .range input { flex: 1; min-width: 0; }
    .range span { color: #555; }

    .filters-actions {
        max-width: 1300px;
        margin: 12px auto 0;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }
    .filters-actions button {
        padding: 8px 18px;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        background: #1a1a1c;
        color: #ddd;
        cursor: pointer;
        font-size: 13px;
    }
    .filters-actions button:hover { background: #262629; }
    .filters-actions .toggle { margin-left: auto; }

    /* Grid */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 16px;
        max-width: 1300px;
        margin: 24px auto;
        padding: 0 24px;
    }
    .card {
        background: #1a1a1c;
        border-radius: 12px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        transition: transform .15s, box-shadow .15s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,.6); }
    .card img {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        background: #262629;
    }
    .card-body { padding: 10px 12px; }
    .card-title {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .card-subtitle {
        font-size: 11px;
        color: #6ea8ff;
        margin-top: 3px;
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 0;
    }
    .card-subtitle:empty { display: none; }
    .card-meta {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #777;
        margin-top: 6px;
    }
    .card-score { color: #ffb347; font-weight: bold; }

    /* Load more */
    .load-more {
        display: block;
        margin: 24px auto 80px;
        padding: 14px 32px;
        border: none;
        border-radius: 10px;
        background: #1a1a1c;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        border: 1px solid #2a2a2a;
    }
    .load-more:hover { background: #262629; }
    .load-more:disabled { opacity: .4; cursor: default; }

    .loader {
        text-align: center;
        padding: 60px;
        color: #666;
        grid-column: 1 / -1;
    }

    .progress-panel {
        max-width: 1300px;
        margin: 12px auto 0;
        padding: 10px 16px;
        background: #141416;
        border: 1px solid #222;
        border-radius: 10px;
        font-size: 12px;
        color: #888;
        display: none;
    }
    .progress-panel.visible { display: block; }
    .progress-panel .row {
        display: flex;
        justify-content: space-between;
        padding: 3px 0;
        gap: 12px;
        flex-wrap: wrap;
    }
    .progress-panel .source { color: #6ea8ff; font-weight: 600; }
    .progress-panel .task { color: #bbb; }
    .progress-panel .done { color: #6ee07a; }
    .progress-panel .pending { color: #ffb347; }
    .progress-toggle {
        color: #555;
        cursor: pointer;
        text-align: right;
        font-size: 11px;
        margin-top: 4px;
        user-select: none;
    }
    .progress-toggle:hover { color: #888; }
</style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="brand">
            <h1 id="page-title">Anime Database</h1>
            <div class="stats" id="stats">Загрузка...</div>
        </div>
        <form class="search" id="search-form">
            <input type="text" id="search-input" placeholder="Поиск...">
            <button type="submit" id="search-btn">Найти</button>
        </form>
        <div class="lang-switch">
            <button data-lang="ru" id="lang-ru">RU</button>
            <button data-lang="en" id="lang-en">EN</button>
        </div>
    </div>

    <div class="filters" id="filters">
        <div class="filter-row">
            <label id="lbl-sort">Сортировка</label>
            <select id="f-sort">
                <option value="popularity" data-ru="По популярности ↓" data-en="By popularity ↓">По популярности ↓</option>
                <option value="score" data-ru="По оценке (AniList) ↓" data-en="By score (AniList) ↓">По оценке ↓</option>
                <option value="score_asc" data-ru="По оценке (AniList) ↑" data-en="By score (AniList) ↑">По оценке ↑</option>
                <option value="mal_score" data-ru="По оценке (MAL) ↓" data-en="By score (MAL) ↓">По MAL ↓</option>
                <option value="start_date" data-ru="По дате выхода ↓" data-en="By release date ↓">По дате ↓</option>
                <option value="start_date_asc" data-ru="По дате выхода ↑" data-en="By release date ↑">По дате ↑</option>
                <option value="title" data-ru="По названию A→Z" data-en="By title A→Z">По названию A→Z</option>
                <option value="title_desc" data-ru="По названию Z→A" data-en="By title Z→A">По названию Z→A</option>
                <option value="title_ru" data-ru="По русскому A→Z" data-en="By Russian A→Z">По русскому A→Z</option>
                <option value="favourites" data-ru="По избранному ↓" data-en="By favourites ↓">По избранному ↓</option>
                <option value="trending" data-ru="По тренду ↓" data-en="By trending ↓">По тренду ↓</option>
                <option value="episodes" data-ru="По эпизодам ↓" data-en="By episodes ↓">По эпизодам ↓</option>
                <option value="id_desc" data-ru="Новые ↓" data-en="Newest ↓">Новые ↓</option>
                <option value="id" data-ru="Старые ↑" data-en="Oldest ↑">Старые ↑</option>
            </select>
        </div>

        <div class="filter-row">
            <label id="lbl-format">Формат</label>
            <select id="f-format"><option value=""></option></select>
        </div>

        <div class="filter-row">
            <label id="lbl-status">Статус</label>
            <select id="f-status"><option value=""></option></select>
        </div>

        <div class="filter-row">
            <label id="lbl-season">Сезон</label>
            <select id="f-season"><option value=""></option></select>
        </div>

        <div class="filter-row">
            <label id="lbl-genre">Жанр</label>
            <select id="f-genre"><option value=""></option></select>
        </div>

        <div class="filter-row">
            <label id="lbl-country">Страна</label>
            <select id="f-country"><option value=""></option></select>
        </div>

        <div class="filter-row">
            <label id="lbl-year">Год</label>
            <div class="range">
                <input type="number" id="f-year-from" placeholder="от">
                <span>—</span>
                <input type="number" id="f-year-to" placeholder="до">
            </div>
        </div>

        <div class="filter-row">
            <label id="lbl-score">Оценка</label>
            <div class="range">
                <input type="number" id="f-score-from" placeholder="от">
                <span>—</span>
                <input type="number" id="f-score-to" placeholder="до">
            </div>
        </div>

        <div class="filter-row">
            <label id="lbl-adult">18+</label>
            <select id="f-adult">
                <option value="any" data-ru="Любые" data-en="Any">Любые</option>
                <option value="no" data-ru="Только без 18+" data-en="Safe only">Только без 18+</option>
                <option value="only" data-ru="Только 18+" data-en="Adult only">Только 18+</option>
            </select>
        </div>

        <div class="filter-row">
            <label id="lbl-licensed">Лицензия</label>
            <select id="f-licensed">
                <option value="" data-ru="Любая" data-en="Any">Любая</option>
                <option value="yes" data-ru="Лицензировано" data-en="Licensed">Лицензировано</option>
                <option value="no" data-ru="Не лицензировано" data-en="Not licensed">Не лицензировано</option>
            </select>
        </div>

        <div class="filter-row">
            <label id="lbl-has-ru">Русский</label>
            <select id="f-has-ru">
                <option value="" data-ru="Не важно" data-en="Doesn't matter">Не важно</option>
                <option value="yes" data-ru="Только с русским" data-en="Russian only">Только с русским</option>
            </select>
        </div>
    </div>

    <div class="filters-actions">
        <button id="btn-apply">Применить</button>
        <button id="btn-reset">Сбросить</button>
        <button id="btn-toggle" class="toggle">Свернуть фильтры</button>
    </div>

    <div class="progress-panel" id="progress-panel">
        <div id="progress-content">Загрузка статуса...</div>
        <div class="progress-toggle" id="progress-toggle">Свернуть</div>
    </div>
</header>

<div class="grid" id="grid">
    <div class="loader">Загрузка...</div>
</div>

<button class="load-more" id="load-more">Загрузить ещё</button>

<script>
// ============================================================
// ЛОКАЛИЗАЦИЯ
// ============================================================
const I18N = {
    ru: {
        title: 'Каталог аниме',
        search_ph: 'Поиск по названию...',
        search_btn: 'Найти',
        sort: 'Сортировка',
        format: 'Формат',
        status: 'Статус',
        season: 'Сезон',
        genre: 'Жанр',
        country: 'Страна',
        year: 'Год',
        score: 'Оценка',
        adult: '18+',
        licensed: 'Лицензия',
        has_ru: 'Русский',
        apply: 'Применить',
        reset: 'Сбросить',
        collapse: 'Свернуть фильтры',
        expand: 'Развернуть фильтры',
        found: 'Найдено',
        loading: 'Загрузка...',
        nothing: 'Ничего не найдено',
        error: 'Ошибка загрузки',
        load_more: 'Загрузить ещё',
        from: 'от',
        to: 'до',
        any: 'Любой',
        progress: 'Загрузка статуса...',
        progress_collapse: 'Свернуть',
        progress_expand: 'Развернуть',
        progress_active: 'Загрузчиков активно',
    },
    en: {
        title: 'Anime Catalog',
        search_ph: 'Search by title...',
        search_btn: 'Search',
        sort: 'Sort',
        format: 'Format',
        status: 'Status',
        season: 'Season',
        genre: 'Genre',
        country: 'Country',
        year: 'Year',
        score: 'Score',
        adult: 'Adult',
        licensed: 'License',
        has_ru: 'Russian',
        apply: 'Apply',
        reset: 'Reset',
        collapse: 'Hide filters',
        expand: 'Show filters',
        found: 'Found',
        loading: 'Loading...',
        nothing: 'Nothing found',
        error: 'Load error',
        load_more: 'Load more',
        from: 'from',
        to: 'to',
        any: 'Any',
        progress: 'Loading status...',
        progress_collapse: 'Hide',
        progress_expand: 'Show',
        progress_active: 'Active loaders',
    }
};

let currentLang = localStorage.getItem('lang') || 'ru';

function t(key) {
    return I18N[currentLang][key] || key;
}

// ============================================================
// СОСТОЯНИЕ
// ============================================================
const grid = document.getElementById('grid');
const loadMoreBtn = document.getElementById('load-more');
const searchForm = document.getElementById('search-form');
const searchInput = document.getElementById('search-input');
const searchBtn = document.getElementById('search-btn');
const stats = document.getElementById('stats');
const filtersPanel = document.getElementById('filters');
const progressPanel = document.getElementById('progress-panel');
const progressContent = document.getElementById('progress-content');
const progressToggle = document.getElementById('progress-toggle');
const pageTitle = document.getElementById('page-title');

let page = 1;
let loading = false;
let exhausted = false;
let progressCollapsed = false;

const state = {
    q: '',
    sort: 'popularity',
    format: '', status: '', season: '', genre: '', country: '',
    year_from: '', year_to: '', score_from: '', score_to: '',
    adult: 'any', licensed: '', has_ru: '',
};

// ============================================================
// ЛОКАЛИЗАЦИЯ UI
// ============================================================
function applyLang() {
    document.documentElement.lang = currentLang;
    document.title = currentLang === 'ru' ? 'Каталог аниме' : 'Anime Catalog';

    // Шапка
    pageTitle.textContent = t('title');
    searchInput.placeholder = t('search_ph');
    searchBtn.textContent = t('search_btn');

    // Кнопки фильтров
    document.getElementById('btn-apply').textContent = t('apply');
    document.getElementById('btn-reset').textContent = t('reset');
    const toggleBtn = document.getElementById('btn-toggle');
    toggleBtn.textContent = filtersPanel.classList.contains('collapsed') ? t('expand') : t('collapse');

    // Метки
    document.getElementById('lbl-sort').textContent = t('sort');
    document.getElementById('lbl-format').textContent = t('format');
    document.getElementById('lbl-status').textContent = t('status');
    document.getElementById('lbl-season').textContent = t('season');
    document.getElementById('lbl-genre').textContent = t('genre');
    document.getElementById('lbl-country').textContent = t('country');
    document.getElementById('lbl-year').textContent = t('year');
    document.getElementById('lbl-score').textContent = t('score');
    document.getElementById('lbl-adult').textContent = t('adult');
    document.getElementById('lbl-licensed').textContent = t('licensed');
    document.getElementById('lbl-has-ru').textContent = t('has_ru');

    // Placeholder'ы диапазонов
    document.getElementById('f-year-from').placeholder = t('from');
    document.getElementById('f-year-to').placeholder = t('to');
    document.getElementById('f-score-from').placeholder = t('from');
    document.getElementById('f-score-to').placeholder = t('to');

    // Опции dropdown'ов с data-ru / data-en
    document.querySelectorAll('option[data-ru][data-en]').forEach(opt => {
        opt.textContent = opt.dataset[currentLang];
    });

    // Пустые опции
    document.querySelectorAll('select > option[value=""]').forEach(opt => {
        if (!opt.dataset.ru && !opt.dataset.en) {
            opt.textContent = t('any');
        }
    });

    // Load more
    loadMoreBtn.textContent = t('load_more');

    // Прогресс-панель
    progressToggle.textContent = progressCollapsed ? t('progress_expand') : t('progress_collapse');

    // Переключатель
    document.getElementById('lang-ru').classList.toggle('active', currentLang === 'ru');
    document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');

    // Заголовок фильтров "Свернуть/Развернуть"
    toggleBtn.textContent = filtersPanel.classList.contains('collapsed') ? t('expand') : t('collapse');
}

document.getElementById('lang-ru').addEventListener('click', () => {
    currentLang = 'ru';
    localStorage.setItem('lang', 'ru');
    applyLang();
    loadCount();
    loadPage(true);
});

document.getElementById('lang-en').addEventListener('click', () => {
    currentLang = 'en';
    localStorage.setItem('lang', 'en');
    applyLang();
    loadCount();
    loadPage(true);
});

// ============================================================
// API
// ============================================================
function buildQuery(includePage = true) {
    const p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    if (state.sort) p.set('sort', state.sort);
    if (state.format) p.set('format', state.format);
    if (state.status) p.set('status', state.status);
    if (state.season) p.set('season', state.season);
    if (state.genre) p.set('genre', state.genre);
    if (state.country) p.set('country', state.country);
    if (state.year_from) p.set('year_from', state.year_from);
    if (state.year_to) p.set('year_to', state.year_to);
    if (state.score_from) p.set('score_from', state.score_from);
    if (state.score_to) p.set('score_to', state.score_to);
    if (state.adult && state.adult !== 'any') p.set('adult', state.adult);
    if (state.licensed) p.set('licensed', state.licensed);
    if (state.has_ru) p.set('has_ru', state.has_ru);
    if (includePage) p.set('page', page);
    return p.toString();
}

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Выбор названия в зависимости от языка
// RU: Shikimori -> машинный перевод -> romaji
// EN: english -> romaji
function pickTitle(it) {
    if (currentLang === 'ru') {
        return it.title_russian || it.title_ru_machine || it.title || '?';
    }
    return it.title_english || it.title || '?';
}

// Второе название — другое написание (romaji / русское), но не дубль основного
function pickSubtitle(it) {
    const main = pickTitle(it);
    const candidates = currentLang === 'ru'
        ? [it.title, it.title_english]
        : [it.title, it.title_russian, it.title_ru_machine];
    return candidates.find(x => x && x !== main) || '';
}

async function loadCount() {
    try {
        const r = await fetch('/api/count?' + buildQuery(false));
        const j = await r.json();
        stats.textContent = `${t('found')}: ${j.count}`;
    } catch (e) {
        stats.textContent = t('error');
    }
}

async function loadPage(reset = false) {
    if (loading || exhausted) return;
    loading = true;
    loadMoreBtn.disabled = true;

    if (reset) {
        page = 1;
        exhausted = false;
        grid.innerHTML = `<div class="loader">${t('loading')}</div>`;
        loadCount();
    }

    const url = '/api/list?' + buildQuery(true);
    try {
        const res = await fetch(url);
        const items = await res.json();

        if (reset) grid.innerHTML = '';

        if (items.length === 0) {
            if (reset) grid.innerHTML = `<div class="loader">${t('nothing')}</div>`;
            exhausted = true;
            loadMoreBtn.style.display = 'none';
        } else {
            for (const it of items) {
                const a = document.createElement('a');
                a.className = 'card';
                a.href = `/detail?id=${it.id}`;

                const title = pickTitle(it);
                const subtitle = pickSubtitle(it);

                const meta = [
                    it.year ? `<span>${it.year}</span>` : '',
                    it.format ? `<span>${esc(it.format)}</span>` : '',
                ].filter(Boolean).join('');

                a.innerHTML = `
                    <img src="${esc(it.cover) || 'https://via.placeholder.com/230x345?text=No+Cover'}"
                         alt="" loading="lazy"
                         onerror="this.src='https://via.placeholder.com/230x345?text=No+Cover'">
                    <div class="card-body">
                        <div class="card-title">${esc(title)}</div>
                        <div class="card-subtitle">${esc(subtitle)}</div>
                        <div class="card-meta">
                            <span>${meta}</span>
                            ${it.score > 0 ? `<span class="card-score">★ ${it.score}</span>` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(a);
            }
            loadMoreBtn.style.display = 'block';
            page++;
        }
    } catch (e) {
        console.error(e);
        if (reset) grid.innerHTML = `<div class="loader">${t('error')}</div>`;
    } finally {
        loading = false;
        loadMoreBtn.disabled = false;
    }
}

async function loadFilters() {
    try {
        const r = await fetch('/api/filters');
        const j = await r.json();

        const fill = (id, arr, fallbackText) => {
            const sel = document.getElementById(id);
            // Очищаем кроме первой опции
            while (sel.options.length > 1) sel.remove(1);
            sel.options[0].textContent = fallbackText;

            for (const v of arr) {
                const o = document.createElement('option');
                o.value = v;
                o.textContent = v;
                sel.appendChild(o);
            }
        };

        fill('f-format', j.formats || [], t('any'));
        fill('f-status', j.statuses || [], t('any'));
        fill('f-season', j.seasons || [], t('any'));
        fill('f-country', j.countries || [], t('any'));
        fill('f-genre', j.genres || [], t('any'));

        // Переприменяем локализацию для новых опций
        document.querySelectorAll('select > option[value=""]').forEach(opt => {
            if (!opt.dataset.ru && !opt.dataset.en) {
                opt.textContent = t('any');
            }
        });
    } catch (e) {
        console.error('Filters load error', e);
    }
}

function readUI() {
    state.sort = document.getElementById('f-sort').value;
    state.format = document.getElementById('f-format').value;
    state.status = document.getElementById('f-status').value;
    state.season = document.getElementById('f-season').value;
    state.genre = document.getElementById('f-genre').value;
    state.country = document.getElementById('f-country').value;
    state.year_from = document.getElementById('f-year-from').value;
    state.year_to = document.getElementById('f-year-to').value;
    state.score_from = document.getElementById('f-score-from').value;
    state.score_to = document.getElementById('f-score-to').value;
    state.adult = document.getElementById('f-adult').value;
    state.licensed = document.getElementById('f-licensed').value;
    state.has_ru = document.getElementById('f-has-ru').value;
}

async function loadProgress() {
    try {
        const r = await fetch('/api/progress');
        const items = await r.json();

        if (!Array.isArray(items) || items.length === 0) {
            progressPanel.classList.remove('visible');
            return;
        }

        progressPanel.classList.add('visible');

        if (progressCollapsed) {
            const active = items.filter(i => !i.finished).length;
            progressContent.innerHTML = `<div class="row"><span>${t('progress_active')}: ${active} / ${items.length}</span></div>`;
            return;
        }

        const rows = items.map(i => {
            const status = i.finished
                ? `<span class="done">✓</span>`
                : `<span class="pending">● p.${i.last_page} (${i.total_saved})</span>`;
            return `<div class="row">
                <span><span class="source">${esc(i.source)}</span> · <span class="task">${esc(i.task)}</span></span>
                <span>${status}</span>
            </div>`;
        }).join('');

        progressContent.innerHTML = rows;
    } catch (e) {
        progressPanel.classList.remove('visible');
    }
}

progressToggle.addEventListener('click', () => {
    progressCollapsed = !progressCollapsed;
    progressToggle.textContent = progressCollapsed ? t('progress_expand') : t('progress_collapse');
    loadProgress();
});

// ============================================================
// СОБЫТИЯ
// ============================================================
document.getElementById('btn-apply').addEventListener('click', () => {
    readUI();
    loadPage(true);
});

document.getElementById('btn-reset').addEventListener('click', () => {
    document.getElementById('f-sort').value = 'popularity';
    document.getElementById('f-format').value = '';
    document.getElementById('f-status').value = '';
    document.getElementById('f-season').value = '';
    document.getElementById('f-genre').value = '';
    document.getElementById('f-country').value = '';
    document.getElementById('f-year-from').value = '';
    document.getElementById('f-year-to').value = '';
    document.getElementById('f-score-from').value = '';
    document.getElementById('f-score-to').value = '';
    document.getElementById('f-adult').value = 'any';
    document.getElementById('f-licensed').value = '';
    document.getElementById('f-has-ru').value = '';
    searchInput.value = '';
    state.q = '';
    readUI();
    loadPage(true);
});

document.getElementById('btn-toggle').addEventListener('click', (e) => {
    filtersPanel.classList.toggle('collapsed');
    e.target.textContent = filtersPanel.classList.contains('collapsed') ? t('expand') : t('collapse');
});

['f-sort', 'f-format', 'f-status', 'f-season', 'f-genre', 'f-country', 'f-adult', 'f-licensed', 'f-has-ru']
    .forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
            readUI();
            loadPage(true);
        });
    });

['f-year-from', 'f-year-to', 'f-score-from', 'f-score-to'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
        if (e.key === 'Enter') {
            readUI();
            loadPage(true);
        }
    });
});

searchForm.addEventListener('submit', e => {
    e.preventDefault();
    state.q = searchInput.value.trim();
    loadPage(true);
});

loadMoreBtn.addEventListener('click', () => loadPage(false));

// ============================================================

// ============================================================
applyLang();
loadFilters();
readUI();
loadPage(true);
loadProgress();
setInterval(loadProgress, 3000);
</script>
