<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<!-- Without a viewport meta the layout renders at desktop width on a phone,
     which is why the previous version was unusable on mobile. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Каталог аниме</title>
<meta name="description" content="Каталог аниме с русскими названиями, оценками, жанрами и описаниями. Данные AniList, Kitsu и Shikimori.">
<meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f9" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Каталог аниме">
<meta property="og:description" content="Каталог аниме с русскими названиями, оценками и жанрами.">
<meta property="og:image" content="/static/icon-512.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="appbar">
    <div class="appbar__inner">
        <a class="brand" href="/">
            <span class="brand__mark" aria-hidden="true">A</span>
            <span>
                <span data-i18n="catalog">Каталог аниме</span>
                <span class="brand__count" id="brand-count"></span>
            </span>
        </a>

        <div class="appbar__spacer"></div>

        <div class="search" role="search">
            <span class="search__icon" aria-hidden="true">&#128269;</span>
            <input class="search__input" id="search-input" type="search" autocomplete="off"
                   autocapitalize="off" spellcheck="false" enterkeyhint="search"
                   data-i18n-ph="search_ph" placeholder="Поиск по названию…"
                   aria-label="Поиск" aria-expanded="false" aria-controls="suggest" role="combobox">
            <button class="search__clear" id="search-clear" type="button" hidden aria-label="Очистить">&#10005;</button>
            <div class="suggest" id="suggest" role="listbox" hidden></div>
        </div>

        <button class="icon-btn" id="btn-list" type="button" data-i18n-title="my_list" title="Мой список" aria-label="Мой список">&#128278;</button>
        <button class="icon-btn" id="btn-theme" type="button" data-i18n-title="theme" title="Тема" aria-label="Переключить тему">&#9680;</button>
        <a class="avatar" id="btn-account" href="#" data-i18n-title="account" title="Аккаунт" aria-label="Аккаунт">?</a>
    </div>

    <div class="filterbar" id="filterbar"></div>
</header>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<aside class="sheet" id="sheet" hidden aria-label="Фильтры">
    <div class="sheet__grip" aria-hidden="true"></div>
    <div class="sheet__head">
        <span class="sheet__title" data-i18n="filters">Фильтры</span>
        <button class="btn btn--ghost btn--sm" id="sheet-reset" type="button" data-i18n="reset">Сбросить</button>
        <button class="icon-btn" id="sheet-close" type="button" aria-label="Закрыть">&#10005;</button>
    </div>
    <div class="sheet__body" id="sheet-body"></div>
    <div class="sheet__foot">
        <button class="btn btn--primary" id="sheet-apply" type="button" data-i18n="apply">Показать</button>
    </div>
</aside>

<main class="content">
    <div class="grid" id="grid" aria-busy="true"></div>
    <div class="sentinel" id="sentinel"></div>
    <div class="state" id="end-state" hidden></div>
</main>

<script src="/static/app.js"></script>
<script src="/static/catalog.js" defer></script>
</body>
</html>
