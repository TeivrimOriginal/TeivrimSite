<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Anime Detail</title>
<style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0e0e10; color: #eaeaea; margin: 0; padding: 0; line-height: 1.5; }

    /* Header */
    header {
        background: #141416;
        border-bottom: 1px solid #222;
        padding: 14px 24px;
        position: sticky;
        top: 0;
        z-index: 20;
    }
    .header-top {
        max-width: 1300px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: inherit;
    }
    .brand h1 { margin: 0; font-size: 20px; color: #ff4757; }
    .back-btn {
        color: #bbb;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 8px;
        background: #1a1a1c;
        border: 1px solid #2a2a2a;
        font-size: 13px;
    }
    .back-btn:hover { background: #262629; color: #fff; }

    .lang-switch {
        display: flex;
        gap: 0;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #2a2a2a;
    }
    .lang-switch button {
        padding: 8px 14px;
        border: none;
        background: #1a1a1c;
        color: #888;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: background .15s, color .15s;
    }
    .lang-switch button:hover { background: #262629; color: #bbb; }
    .lang-switch button.active { background: #ff4757; color: #fff; }

    /* Banner */
    .banner {
        width: 100%;
        height: 340px;
        background: #1a1a1c center/cover no-repeat;
        position: relative;
    }
    .banner::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(transparent 30%, #0e0e10 95%);
    }

    /* Container */
    .container {
        max-width: 1100px;
        margin: -140px auto 60px;
        padding: 0 24px;
        display: flex;
        gap: 32px;
        position: relative;
        z-index: 2;
    }

    /* Cover */
    .cover-wrap { width: 240px; flex-shrink: 0; }
    .cover {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0,0,0,.8);
        background: #262629;
        display: block;
    }

    /* Info */
    .info { flex: 1; min-width: 0; padding-top: 140px; }
    h1.title { margin: 0 0 6px; font-size: 30px; color: #ff4757; line-height: 1.2; }
    .alt { color: #888; font-size: 14px; margin: 2px 0; }
    .alt.native { color: #666; }
    .alt.ru { color: #6ea8ff; font-weight: 600; }

    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
    .meta span {
        background: #1a1a1c;
        border: 1px solid #2a2a2a;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
        color: #bbb;
        white-space: nowrap;
    }
    .meta span.score { color: #ffb347; font-weight: 700; border-color: #4a3800; }
    .meta span.mal { color: #6ea8ff; border-color: #1a2f5a; }
    .meta span.adult { color: #ff4757; border-color: #5a1015; }

    /* Sections */
    .section { margin: 28px 0; }
    .section h2 {
        font-size: 16px;
        margin: 0 0 12px;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
    }

    .desc {
        line-height: 1.7;
        color: #ccc;
        font-size: 15px;
        background: #141416;
        padding: 16px 20px;
        border-radius: 10px;
        border-left: 3px solid #ff4757;
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    .desc.ru { border-left-color: #6ea8ff; }
    .desc.machine { border-left-color: #ffb347; }

    /* Tags */
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
        background: #ff4757;
        color: #fff;
        padding: 5px 14px;
        border-radius: 14px;
        font-size: 12px;
        font-weight: 600;
    }
    .tag.soft {
        background: #1a1a1c;
        color: #bbb;
        border: 1px solid #2a2a2a;
        font-weight: 400;
    }
    .tag.spoiler {
        background: #2a1a1a;
        color: #e06060;
        border: 1px solid #4a2020;
    }
    .tag.mal {
        background: #1a2438;
        color: #6ea8ff;
        border: 1px solid #2a3f5a;
    }
    .tag a { color: inherit; text-decoration: none; }
    .tag:hover { filter: brightness(1.15); }

    /* Card grids */
    .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
    }
    .mini-card {
        background: #1a1a1c;
        border-radius: 8px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        transition: transform .15s;
        display: flex;
        flex-direction: column;
    }
    .mini-card:hover { transform: translateY(-3px); }
    .mini-card img {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        background: #262629;
    }
    .mini-card .body { padding: 8px 10px; font-size: 12px; }
    .mini-card .rel-type {
        color: #ff4757;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: .5px;
        margin-bottom: 3px;
    }
    .mini-card .t {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        line-height: 1.3;
    }
    .mini-card .sub { color: #666; margin-top: 3px; font-size: 11px; }

    /* Character grid */
    .char-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
    }
    .char-card {
        background: #1a1a1c;
        border-radius: 10px;
        padding: 10px;
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .char-card img {
        width: 50px;
        height: 70px;
        object-fit: cover;
        border-radius: 6px;
        background: #262629;
        flex-shrink: 0;
    }
    .char-card .info-col { min-width: 0; flex: 1; }
    .char-card .char-name { font-size: 13px; font-weight: 600; line-height: 1.25; margin-bottom: 2px; word-wrap: break-word; }
    .char-card .va { font-size: 11px; color: #888; margin-top: 4px; word-wrap: break-word; }
    .char-card .va strong { color: #bbb; }
    .char-card .role-badge { font-size: 10px; text-transform: uppercase; color: #ff4757; margin-bottom: 3px; }

    /* Info table */
    .info-table {
        width: 100%;
        border-collapse: collapse;
        background: #141416;
        border-radius: 10px;
        overflow: hidden;
    }
    .info-table td {
        padding: 10px 16px;
        border-bottom: 1px solid #222;
        font-size: 14px;
        vertical-align: top;
    }
    .info-table td:first-child { color: #777; width: 200px; white-space: nowrap; }
    .info-table td:last-child { color: #ddd; word-break: break-word; }
    .info-table tr:last-child td { border-bottom: none; }

    /* JSON */
    .json-block {
        background: #0a0a0c;
        padding: 16px;
        border-radius: 10px;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 400px;
        overflow-y: auto;
        color: #76e0a3;
        border: 1px solid #1a1a1c;
    }
    details summary {
        cursor: pointer;
        color: #888;
        font-size: 14px;
        padding: 8px 0;
        user-select: none;
    }
    details summary:hover { color: #bbb; }

    /* Back bottom */
    .back {
        display: inline-block;
        margin-top: 30px;
        padding: 12px 24px;
        background: #1a1a1c;
        border: 1px solid #2a2a2a;
        color: #fff;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
    }
    .back:hover { background: #262629; }

    .loader, .err {
        text-align: center;
        padding: 100px 20px;
        font-size: 18px;
    }
    .loader { color: #666; }
    .err { color: #ff4757; }

    @media (max-width: 700px) {
        .container { flex-direction: column; margin-top: -80px; gap: 20px; }
        .cover-wrap { width: 180px; margin: 0 auto; }
        .info { padding-top: 20px; }
        h1.title { font-size: 22px; }
        .info-table td:first-child { width: 120px; }
    }
</style>
</head>
<body>

<header>
    <div class="header-top">
        <a class="brand" href="/">
            <h1 id="page-title">Anime</h1>
        </a>
        <div style="display:flex; gap:10px; align-items:center;">
            <a class="back-btn" href="/" id="back-top">← Назад</a>
            <div class="lang-switch">
                <button data-lang="ru" id="lang-ru">RU</button>
                <button data-lang="en" id="lang-en">EN</button>
            </div>
        </div>
    </div>
</header>

<div id="root">
    <div class="loader">Загрузка...</div>
</div>

<script>
// ============================================================
// I18N
// ============================================================
const I18N = {
    ru: {
        page_title: 'Аниме',
        back: '← Назад',
        loading: 'Загрузка...',
        not_found: 'Не найдено',
        error: 'Ошибка загрузки',
        no_id: 'Не передан id',
        // Секции
        genres: 'Жанры',
        themes: 'Темы (MAL)',
        demographics: 'Демография',
        studios: 'Студии',
        producers: 'Продюсеры',
        licensors: 'Лицензиары',
        description: 'Описание',
        description_ru_shiki: 'Описание (Shikimori, RU)',
        description_ru_machine: 'Описание (машинный перевод)',
        synonyms: 'Синонимы',
        tags: 'Теги',
        characters: 'Персонажи и сейю',
        staff: 'Создатели',
        trailer: 'Трейлер',
        related: 'Связанное',
        recommendations: 'Рекомендации',
        general_info: 'Общая информация',
        external_links: 'Внешние ссылки',
        streaming: 'Эпизоды онлайн',
        raw_json: 'Сырой JSON (все поля)',
        voice_actor: 'Сейю',
        // Meta
        episodes: 'эп.',
        min: 'мин',
        popularity: 'популярность',
        favourites: 'в избранном',
        trending: 'тренд',
        licensed: 'лицензия',
        // Table
        anilist_id: 'AniList ID',
        mal_id: 'MAL ID',
        shikimori_id: 'Shikimori ID',
        user_preferred: 'Предпочитаемое',
        format: 'Формат',
        status: 'Статус',
        duration: 'Длительность',
        season: 'Сезон',
        start: 'Начало',
        end: 'Конец',
        country: 'Страна',
        anilist_score: 'AniList оценка',
        mal_score: 'MAL оценка',
        mal_rank: 'MAL ранг',
        mal_members: 'MAL участники',
        anilist_popularity: 'AniList популярность',
        in_favourites: 'В избранном',
        trend: 'Тренд',
        cover_color: 'Цвет обложки',
        watch_on: 'Смотреть на',
        rating: 'рейтинг',
    },
    en: {
        page_title: 'Anime',
        back: '← Back',
        loading: 'Loading...',
        not_found: 'Not found',
        error: 'Load error',
        no_id: 'No id provided',
        genres: 'Genres',
        themes: 'Themes (MAL)',
        demographics: 'Demographics',
        studios: 'Studios',
        producers: 'Producers',
        licensors: 'Licensors',
        description: 'Description',
        description_ru_shiki: 'Description (Shikimori, RU)',
        description_ru_machine: 'Description (machine translation)',
        synonyms: 'Synonyms',
        tags: 'Tags',
        characters: 'Characters & voice actors',
        staff: 'Staff',
        trailer: 'Trailer',
        related: 'Related',
        recommendations: 'Recommendations',
        general_info: 'General info',
        external_links: 'External links',
        streaming: 'Streaming episodes',
        raw_json: 'Raw JSON (all fields)',
        voice_actor: 'VA',
        episodes: 'ep.',
        min: 'min',
        popularity: 'popularity',
        favourites: 'favourites',
        trending: 'trending',
        licensed: 'licensed',
        anilist_id: 'AniList ID',
        mal_id: 'MAL ID',
        shikimori_id: 'Shikimori ID',
        user_preferred: 'User preferred',
        format: 'Format',
        status: 'Status',
        duration: 'Duration',
        season: 'Season',
        start: 'Start',
        end: 'End',
        country: 'Country',
        anilist_score: 'AniList score',
        mal_score: 'MAL score',
        mal_rank: 'MAL rank',
        mal_members: 'MAL members',
        anilist_popularity: 'AniList popularity',
        in_favourites: 'In favourites',
        trend: 'Trend',
        cover_color: 'Cover color',
        watch_on: 'Watch on',
        rating: 'rating',
    }
};

let currentLang = localStorage.getItem('lang') || 'ru';
const t = (k) => I18N[currentLang][k] || k;

function applyLang() {
    document.documentElement.lang = currentLang;
    document.title = t('page_title');
    document.getElementById('page-title').textContent = t('page_title');
    document.getElementById('back-top').textContent = t('back');
    document.getElementById('lang-ru').classList.toggle('active', currentLang === 'ru');
    document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
}

document.getElementById('lang-ru').addEventListener('click', () => {
    currentLang = 'ru';
    localStorage.setItem('lang', 'ru');
    applyLang();
    load();
});

document.getElementById('lang-en').addEventListener('click', () => {
    currentLang = 'en';
    localStorage.setItem('lang', 'en');
    applyLang();
    load();
});

// ============================================================
// HELPERS
// ============================================================
const params = new URLSearchParams(location.search);
const id = params.get('id');
const root = document.getElementById('root');

function esc(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(y, m, d) {
    const p = [];
    if (y) p.push(y);
    if (m) p.push(String(m).padStart(2, '0'));
    if (d) p.push(String(d).padStart(2, '0'));
    return p.join('-') || '—';
}

function titleOf(obj) {
    if (!obj) return '?';
    return obj.romaji || obj.english || obj.native || '?';
}

function jsonBlock(v) {
    if (v == null || (Array.isArray(v) && v.length === 0)) return '';
    const str = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
    return `<div class="json-block">${esc(str)}</div>`;
}

function arr(v) { return Array.isArray(v) ? v : []; }

function pickTitle(a) {
    if (currentLang === 'ru') {
        return a.title_russian || a.title_ru_machine || a.title_romaji || a.title_english || a.title_native || '?';
    }
    return a.title_english || a.title_romaji || a.title_native || '?';
}

function parseJikanCharacters(raw) {
    const data = raw && raw.data ? raw.data : raw;
    if (!data || !Array.isArray(data.characters)) return [];
    return data.characters.map(c => {
        const name = c.character && c.character.name ? c.character.name : '?';
        const img = c.character && c.character.images && c.character.images.jpg
            ? c.character.images.jpg.image_url : '';
        const role = c.role || '';
        const vas = Array.isArray(c.voice_actors) ? c.voice_actors : [];
        const vaJa = vas.find(v => v.language === 'Japanese');
        const vaName = vaJa && vaJa.person ? vaJa.person.name : (vas[0] && vas[0].person ? vas[0].person.name : '');
        return { name, img, role, vaName };
    });
}

function parseJikanStaff(raw) {
    const data = raw && raw.data ? raw.data : raw;
    if (!data || !Array.isArray(data.staff)) return [];
    return data.staff.map(s => {
        const name = s.person && s.person.name ? s.person.name : '?';
        const img = s.person && s.person.images && s.person.images.jpg
            ? s.person.images.jpg.image_url : '';
        const positions = Array.isArray(s.positions) ? s.positions.join(', ') : '';
        return { name, img, positions };
    });
}

// ============================================================
// LOAD
// ============================================================
async function load() {
    if (!id) { root.innerHTML = `<div class="err">${t('no_id')}</div>`; return; }
    root.innerHTML = `<div class="loader">${t('loading')}</div>`;

    try {
        const r = await fetch('/api/anime/' + id);
        if (!r.ok) { root.innerHTML = `<div class="err">${t('not_found')}</div>`; return; }
        const a = await r.json();

        const cover = a.cover_extra_large || a.cover_large || a.cover_medium || '';
        const banner = a.banner_image || '';

        // === META PILLS ===
        const metaPills = [];
        if (a.format) metaPills.push(`<span>${esc(a.format)}</span>`);
        if (a.status) metaPills.push(`<span>${esc(a.status)}</span>`);
        if (a.episodes) metaPills.push(`<span>${a.episodes} ${t('episodes')}</span>`);
        if (a.duration) metaPills.push(`<span>${a.duration} ${t('min')}</span>`);
        if (a.average_score) metaPills.push(`<span class="score">★ ${a.average_score}</span>`);
        if (a.mal_score) metaPills.push(`<span class="mal">MAL ★ ${a.mal_score}</span>`);
        if (a.popularity) metaPills.push(`<span>${a.popularity} ${t('popularity')}</span>`);
        if (a.mal_members) metaPills.push(`<span>MAL ${a.mal_members}</span>`);
        if (a.favourites) metaPills.push(`<span>${a.favourites} ${t('favourites')}</span>`);
        if (a.start_year) metaPills.push(`<span>${fmtDate(a.start_year, a.start_month, a.start_day)}</span>`);
        if (a.season) metaPills.push(`<span>${esc(a.season)} ${a.season_year || ''}</span>`);
        if (a.country_of_origin) metaPills.push(`<span>${esc(a.country_of_origin)}</span>`);
        if (a.is_adult === 1) metaPills.push(`<span class="adult">18+</span>`);

        // === GENRES ===
        const genresList = [];
        arr(a.genres).forEach(g => genresList.push({ v: g, cls: '' }));
        arr(a.jikan_genres).forEach(g => {
            const name = g && g.name ? g.name : (typeof g === 'string' ? g : '');
            if (name && !genresList.find(x => x.v === name)) genresList.push({ v: name, cls: 'mal' });
        });
        const genresHtml = genresList.length
            ? `<div class="tags">${genresList.map(g => `<span class="tag ${g.cls}">${esc(g.v)}</span>`).join('')}</div>`
            : '';

        // === STUDIOS ===
        const studiosList = [];
        arr(a.studios).forEach(s => studiosList.push({ name: s.name, note: '', cls: '' }));
        arr(a.jikan_studios).forEach(s => {
            const n = s && s.name ? s.name : '';
            if (n && !studiosList.find(x => x.name === n)) studiosList.push({ name: n, note: 'MAL', cls: 'mal' });
        });
        const studiosHtml = studiosList.length
            ? `<div class="tags">${studiosList.map(s => `<span class="tag soft ${s.cls}">${esc(s.name || '?')}${s.note ? ' · ' + esc(s.note) : ''}</span>`).join('')}</div>`
            : '';

        // === TAGS ===
        const tagsHtmlFull = arr(a.tags).length
            ? `<div class="tags">${a.tags.map(tg => {
                const cls = tg.isMediaSpoiler ? 'tag spoiler' : 'tag soft';
                const rank = tg.rank != null ? ` · ${tg.rank}%` : '';
                return `<span class="${cls}">${esc(tg.name || '?')}${rank}</span>`;
            }).join('')}</div>`
            : '';

        // === SYNONYMS ===
        const synHtml = arr(a.synonyms).length
            ? `<div class="tags">${a.synonyms.map(s => `<span class="tag soft">${esc(s)}</span>`).join('')}</div>`
            : '';

        // === MAL THEMES ===
        const themesList = arr(a.jikan_themes).map(x => x && x.name ? x.name : (typeof x === 'string' ? x : '')).filter(Boolean);
        const themesHtml = themesList.length
            ? `<div class="tags">${themesList.map(x => `<span class="tag mal">${esc(x)}</span>`).join('')}</div>`
            : '';

        // === DEMOGRAPHICS ===
        const demoList = arr(a.jikan_demographics).map(x => x && x.name ? x.name : (typeof x === 'string' ? x : '')).filter(Boolean);
        const demoHtml = demoList.length
            ? `<div class="tags">${demoList.map(x => `<span class="tag mal">${esc(x)}</span>`).join('')}</div>`
            : '';

        // === PRODUCERS / LICENSORS ===
        const producersList = arr(a.jikan_producers).map(p => p && p.name ? p.name : '').filter(Boolean);
        const producersHtml = producersList.length
            ? `<div class="tags">${producersList.map(p => `<span class="tag soft">${esc(p)}</span>`).join('')}</div>`
            : '';

        const licensorsList = arr(a.jikan_licensors).map(p => p && p.name ? p.name : '').filter(Boolean);
        const licensorsHtml = licensorsList.length
            ? `<div class="tags">${licensorsList.map(p => `<span class="tag soft">${esc(p)}</span>`).join('')}</div>`
            : '';

        // === RELATIONS ===
        const relationsHtml = arr(a.relations).length
            ? `<div class="card-grid">${a.relations.map(r => {
                const tt = titleOf(r.title);
                const img = r.coverImage || '';
                return `<a class="mini-card" href="/detail?id=${r.id}">
                    ${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
                    <div class="body">
                        <div class="rel-type">${esc(r.relationType || 'related')}</div>
                        <div class="t">${esc(tt)}</div>
                        ${r.format ? `<div class="sub">${esc(r.format)}</div>` : ''}
                    </div>
                </a>`;
            }).join('')}</div>`
            : '';

        // === EXTERNAL LINKS ===
        const extHtml = arr(a.external_links).length
            ? `<div class="tags">${a.external_links.map(l =>
                `<a class="tag soft" target="_blank" rel="noopener" href="${esc(l.url || '#')}">${esc(l.site || 'link')}${l.type ? ' · ' + esc(l.type) : ''}</a>`
            ).join('')}</div>`
            : '';

        // === STREAMING ===
        const streamingHtml = arr(a.streaming_episodes).length
            ? `<div class="tags">${a.streaming_episodes.slice(0, 30).map(s =>
                `<a class="tag soft" target="_blank" rel="noopener" href="${esc(s.url || '#')}">${esc(s.site || 'watch')} · ${esc(s.title || 'ep')}</a>`
            ).join('')}</div>`
            : '';

        // === RECOMMENDATIONS ===
        const recsHtml = arr(a.recommendations).length
            ? `<div class="card-grid">${a.recommendations.map(r => {
                const tt = titleOf(r.title);
                const img = r.cover || '';
                return `<a class="mini-card" href="/detail?id=${r.id}">
                    ${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
                    <div class="body">
                        ${r.rating != null ? `<div class="rel-type">${t('rating')} ${r.rating}</div>` : ''}
                        <div class="t">${esc(tt)}</div>
                        ${r.format ? `<div class="sub">${esc(r.format)}</div>` : ''}
                    </div>
                </a>`;
            }).join('')}</div>`
            : '';

        // === CHARACTERS ===
        const chars = parseJikanCharacters(a.jikan_characters);
        const charsHtml = chars.length
            ? `<div class="char-grid">${chars.slice(0, 40).map(c => `
                <div class="char-card">
                    ${c.img ? `<img src="${esc(c.img)}" alt="" loading="lazy" onerror="this.style.display='none'">` : `<img src="https://via.placeholder.com/50x70?text=?" alt="">`}
                    <div class="info-col">
                        <div class="role-badge">${esc(c.role || '')}</div>
                        <div class="char-name">${esc(c.name)}</div>
                        ${c.vaName ? `<div class="va">${t('voice_actor')}: <strong>${esc(c.vaName)}</strong></div>` : ''}
                    </div>
                </div>
            `).join('')}</div>`
            : '';

        // === STAFF ===
        const staff = parseJikanStaff(a.jikan_staff);
        const staffHtml = staff.length
            ? `<div class="char-grid">${staff.slice(0, 40).map(s => `
                <div class="char-card">
                    ${s.img ? `<img src="${esc(s.img)}" alt="" loading="lazy" onerror="this.style.display='none'">` : `<img src="https://via.placeholder.com/50x70?text=?" alt="">`}
                    <div class="info-col">
                        <div class="char-name">${esc(s.name)}</div>
                        ${s.positions ? `<div class="va">${esc(s.positions)}</div>` : ''}
                    </div>
                </div>
            `).join('')}</div>`
            : '';

        // === TRAILER ===
        let trailerHtml = '';
        if (a.trailer_id && a.trailer_site) {
            const url = a.trailer_site.toLowerCase() === 'youtube'
                ? `https://www.youtube.com/watch?v=${esc(a.trailer_id)}`
                : '#';
            trailerHtml = `
                <div class="section">
                    <h2>${t('trailer')}</h2>
                    <a href="${url}" target="_blank" rel="noopener" class="tag">▶ ${t('watch_on')} ${esc(a.trailer_site)}</a>
                    ${a.trailer_thumbnail ? `<div style="margin-top:12px"><img src="${esc(a.trailer_thumbnail)}" style="max-width:100%;border-radius:10px"></div>` : ''}
                </div>`;
        }

        // === INFO TABLE ===
        const infoTable = `
            <div class="section">
                <h2>${t('general_info')}</h2>
                <table class="info-table">
                    ${a.id ? `<tr><td>${t('anilist_id')}</td><td>${a.id}</td></tr>` : ''}
                    ${a.mal_id ? `<tr><td>${t('mal_id')}</td><td><a style="color:#6ea8ff" target="_blank" href="https://myanimelist.net/anime/${a.mal_id}">${a.mal_id}</a></td></tr>` : ''}
                    ${a.shikimori_id ? `<tr><td>${t('shikimori_id')}</td><td><a style="color:#6ea8ff" target="_blank" href="https://shikimori.one/animes/${a.shikimori_id}">${a.shikimori_id}</a></td></tr>` : ''}
                    ${a.title_user_preferred ? `<tr><td>${t('user_preferred')}</td><td>${esc(a.title_user_preferred)}</td></tr>` : ''}
                    ${a.format ? `<tr><td>${t('format')}</td><td>${esc(a.format)}</td></tr>` : ''}
                    ${a.status ? `<tr><td>${t('status')}</td><td>${esc(a.status)}</td></tr>` : ''}
                    ${a.episodes ? `<tr><td>${t('episodes')}</td><td>${a.episodes}</td></tr>` : ''}
                    ${a.duration ? `<tr><td>${t('duration')}</td><td>${a.duration} ${t('min')}</td></tr>` : ''}
                    ${a.season ? `<tr><td>${t('season')}</td><td>${esc(a.season)} ${a.season_year || ''}</td></tr>` : ''}
                    ${a.start_year ? `<tr><td>${t('start')}</td><td>${fmtDate(a.start_year, a.start_month, a.start_day)}</td></tr>` : ''}
                    ${a.end_year ? `<tr><td>${t('end')}</td><td>${fmtDate(a.end_year, a.end_month, a.end_day)}</td></tr>` : ''}
                    ${a.country_of_origin ? `<tr><td>${t('country')}</td><td>${esc(a.country_of_origin)}</td></tr>` : ''}
                    ${a.average_score ? `<tr><td>${t('anilist_score')}</td><td>${a.average_score}</td></tr>` : ''}
                    ${a.mal_score ? `<tr><td>${t('mal_score')}</td><td>${a.mal_score}</td></tr>` : ''}
                    ${a.mal_rank ? `<tr><td>${t('mal_rank')}</td><td>#${a.mal_rank}</td></tr>` : ''}
                    ${a.mal_members ? `<tr><td>${t('mal_members')}</td><td>${a.mal_members}</td></tr>` : ''}
                    ${a.popularity ? `<tr><td>${t('anilist_popularity')}</td><td>${a.popularity}</td></tr>` : ''}
                    ${a.favourites ? `<tr><td>${t('in_favourites')}</td><td>${a.favourites}</td></tr>` : ''}
                    ${a.trending ? `<tr><td>${t('trend')}</td><td>${a.trending}</td></tr>` : ''}
                    ${a.cover_color ? `<tr><td>${t('cover_color')}</td><td><span style="display:inline-block;width:14px;height:14px;background:#${esc(a.cover_color)};border-radius:3px;vertical-align:middle"></span> #${esc(a.cover_color)}</td></tr>` : ''}
                </table>
            </div>
        `;

        // === ОПИСАНИЯ ===
        let descHtml = '';
        if (currentLang === 'ru') {
            if (a.description_ru) {
                descHtml += `<div class="section"><h2>${t('description_ru_shiki')}</h2><div class="desc ru">${esc(a.description_ru)}</div></div>`;
            } else if (a.description_ru_machine) {
                descHtml += `<div class="section"><h2>${t('description_ru_machine')}</h2><div class="desc machine">${esc(a.description_ru_machine)}</div></div>`;
            }
            if (a.description) {
                descHtml += `<div class="section"><h2>${t('description')} (EN)</h2><div class="desc">${esc(a.description)}</div></div>`;
            }
        } else {
            if (a.description) {
                descHtml += `<div class="section"><h2>${t('description')}</h2><div class="desc">${esc(a.description)}</div></div>`;
            }
        }

        // === ИТОГОВЫЙ HTML ===
        root.innerHTML = `
            <div class="banner" ${banner ? `style="background-image:url('${esc(banner)}')"` : ''}></div>
            <div class="container">
                <div class="cover-wrap">
                    <img class="cover" src="${esc(cover)}" alt="" onerror="this.src='https://via.placeholder.com/240x360?text=No+Cover'">
                </div>
                <div class="info">
                    <h1 class="title">${esc(pickTitle(a))}</h1>
                    ${currentLang === 'ru' && a.title_russian ? `<div class="alt ru">RU: ${esc(a.title_russian)}</div>` : ''}
                    ${currentLang === 'ru' && a.title_ru_machine && !a.title_russian ? `<div class="alt ru">RU (машинный): ${esc(a.title_ru_machine)}</div>` : ''}
                    ${a.title_romaji ? `<div class="alt">Romaji: ${esc(a.title_romaji)}</div>` : ''}
                    ${a.title_english && currentLang === 'ru' ? `<div class="alt">EN: ${esc(a.title_english)}</div>` : ''}
                    ${a.title_native ? `<div class="alt native">JP: ${esc(a.title_native)}</div>` : ''}

                    <div class="meta">${metaPills.join('')}</div>

                    ${genresHtml ? `<div class="section"><h2>${t('genres')}</h2>${genresHtml}</div>` : ''}
                    ${themesHtml ? `<div class="section"><h2>${t('themes')}</h2>${themesHtml}</div>` : ''}
                    ${demoHtml ? `<div class="section"><h2>${t('demographics')}</h2>${demoHtml}</div>` : ''}
                    ${studiosHtml ? `<div class="section"><h2>${t('studios')}</h2>${studiosHtml}</div>` : ''}
                    ${producersHtml ? `<div class="section"><h2>${t('producers')}</h2>${producersHtml}</div>` : ''}
                    ${licensorsHtml ? `<div class="section"><h2>${t('licensors')}</h2>${licensorsHtml}</div>` : ''}

                    ${descHtml}

                    ${synHtml ? `<div class="section"><h2>${t('synonyms')}</h2>${synHtml}</div>` : ''}
                    ${tagsHtmlFull ? `<div class="section"><h2>${t('tags')}</h2>${tagsHtmlFull}</div>` : ''}

                    ${charsHtml ? `<div class="section"><h2>${t('characters')} (${chars.length})</h2>${charsHtml}</div>` : ''}
                    ${staffHtml ? `<div class="section"><h2>${t('staff')} (${staff.length})</h2>${staffHtml}</div>` : ''}

                    ${trailerHtml}

                    ${relationsHtml ? `<div class="section"><h2>${t('related')}</h2>${relationsHtml}</div>` : ''}
                    ${recsHtml ? `<div class="section"><h2>${t('recommendations')}</h2>${recsHtml}</div>` : ''}

                    ${infoTable}

                    ${extHtml ? `<div class="section"><h2>${t('external_links')}</h2>${extHtml}</div>` : ''}
                    ${streamingHtml ? `<div class="section"><h2>${t('streaming')}</h2>${streamingHtml}</div>` : ''}

                    <div class="section">
                        <details>
                            <summary>${t('raw_json')}</summary>
                            ${jsonBlock(a)}
                        </details>
                    </div>

                    <a class="back" href="/">${t('back')}</a>
                </div>
            </div>
        `;
    } catch (e) {
        console.error(e);
        root.innerHTML = `<div class="err">${t('error')}: ${esc(e.message)}</div>`;
    }
}

// ============================================================
// INIT
// ============================================================
applyLang();
load();
</script>

</body>
</html>
