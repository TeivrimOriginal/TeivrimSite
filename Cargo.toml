[package]
name = "anime_db"
version = "2.0.0"
edition = "2021"
rust-version = "1.80"
description = "Anime catalogue aggregating AniList, Kitsu and Shikimori, served as a JSON API plus a static web frontend"
license = "MIT"
repository = "https://github.com/TeivrimOriginal/TeivrimSite"
default-run = "anime_db"

[[bin]]
name = "anime_db"
path = "src/main.rs"

# Dependencies are deliberately minimal and every one of them is pinned to a
# version present in the local cargo cache, so the project builds offline.
#
# Removed on purpose:
#   actix-cors   -> src/http/cors.rs      (CORS is ~40 lines, see http/mod.rs)
#   actix-files  -> src/http/static_files.rs
#   deadpool     -> src/db/pool.rs        (SQLite needs no async pool)
#   actix macros -> routing is built in code, so actix-codegen is not needed
[dependencies]
# `macros` is required for `#[actix_web::main]`; routing itself is built in
# code, not with attribute macros, but the runtime macro needs the feature.
actix-web = { version = "=4.15.0", default-features = false, features = [
    "macros",
    "compress-brotli",
    "compress-gzip",
    "cookies",
    "http2",
] }
rusqlite = { version = "=0.31.0", features = ["bundled", "functions", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# rustls instead of native-tls: no OpenSSL headers needed on the build host,
# which keeps the Docker image small and cross builds trivial.
reqwest = { version = "=0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "charset",
] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "signal", "sync", "fs"] }
futures-util = "=0.3.34"
urlencoding = "=2.1.3"
percent-encoding = "=2.3.2"
mime_guess = "=2.0.5"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "password-hash"] }
sha2 = "=0.10.9"
getrandom = "=0.2.17"
base64 = "=0.22.1"
hex = "=0.4.3"
dotenvy = "=0.15.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
